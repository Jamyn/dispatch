# Codecov is advisory here: none of these statuses are in the branch ruleset's
# required checks, so a coverage drop annotates the PR without blocking it.
# Promoting one to required is a ruleset change, not a change to this file.

coverage:
  status:
    # `auto` compares against the PR base rather than an absolute number, so a
    # historically under-covered file never fails a PR that does not touch it.
    # The threshold is what makes this a regression gate instead of noise.
    project:
      default:
        target: auto
        threshold: 1%
    # Coverage of the lines this PR actually changed. Held to a real number
    # because it is the only figure the author can act on directly.
    patch:
      default:
        target: 80%
        threshold: 0%

# Path-based, so these cost no extra upload and no CI change -- they slice the
# report python-test already produces. Paths carry the src/dispatch prefix
# because coverage.xml names files relative to <source>src/dispatch</source>
# and Codecov joins the two; without it every component matches nothing.
#
# No component statuses on purpose. Making three more checks fail before anyone
# has agreed these numbers should move is how coverage gates get ignored.
component_management:
  individual_components:
    # The orchestration layer -- incident and case lifecycle. Its own component
    # because */models.py is 95.5% (declarative classes, covered by being
    # imported) and drags the project figure well above what the logic scores.
    - component_id: flows
      name: flows
      paths: ["src/dispatch/**/flows.py"]

    # Provider integrations. Six of roughly seventeen provider packages have a
    # test suite, so this moves for reasons the project figure hides.
    - component_id: plugins
      name: plugins
      paths: ["src/dispatch/plugins/**"]

    # Chosen for consequence rather than size: there is no tests/auth directory.
    - component_id: auth
      name: auth
      paths: ["src/dispatch/auth/**"]

comment:
  layout: "condensed_header, diff, components, files"
  # Nothing to say on a PR that changes no covered line.
  require_changes: true

# The suite runs under pytest-xdist and pytest-cov combines the workers into a
# single report before upload, so exactly one file arrives per commit.
codecov:
  require_ci_to_pass: true
