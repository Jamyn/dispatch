# Naming `labels` explicitly opts Dependabot out of creating its own default
# `dependencies` label, and every name here must exist as a repository label --
# an undefined label is silently ignored, which would leave the PR unlabelled
# and blocked by the enforce-labels gate that these entries exist to satisfy.
version: 2
updates:
  # Actions are the highest-value ecosystem here: a compromised action runs
  # with the workflow's token, so keeping SHA pins current matters more than
  # any application dependency.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels: ["maintenance", "github-actions"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    labels: ["maintenance", "docker"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    labels: ["maintenance"]
    ignore:
      # thinc is a matched pin governed entirely by spacy's range (spacy 3.8.x
      # requires thinc >=8.3.12,<8.4.0), so a standalone bump is unsatisfiable
      # by construction. It moves only when spacy moves.
      - dependency-name: "thinc"
      # pydantic pins pydantic-core exactly -- pydantic 2.13.4 declares
      # `Requires-Dist: pydantic-core==2.46.4` -- so bumping it alone yields a
      # lock uv cannot reproduce. It moves only when pydantic moves.
      - dependency-name: "pydantic-core"
      # fastapi is held on 0.136.x. From 0.141 an included router stays lazy as
      # _IncludedRouter with no `.path`, and get_path_params_from_request in
      # src/dispatch/main.py reads `.path` off every route on every request.
      # Unpinning needs db_session_middleware rewritten first.
      - dependency-name: "fastapi"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # spacy shipped cp314 wheels through 3.8.13 then dropped them in 3.8.14
      # and 3.8.15, and the runtime image has no compiler for the sdist. This
      # is not a permanent hold: delete these versions once a release restores
      # the cp314 build.
      - dependency-name: "spacy"
        versions: ["3.8.14", "3.8.15"]
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/src/dispatch/static/dispatch"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    labels: ["maintenance"]
    ignore:
      # apexcharts is held at ^3.44.0; vue3-apexcharts' peer floor moves within
      # its own 1.x line, so any bump re-selects an unsatisfiable peer. Lifting
      # this needs an apexcharts 3 -> 5/6 migration in its own PR.
      - dependency-name: "vue3-apexcharts"
      # @openid/appauth 1.4.0 is ESM-only and its published ESM uses
      # extensionless relative specifiers, which Node's resolver rejects, so
      # vitest cannot load it even though the vite build bundles it fine. It
      # also moved built/ to built/src/, breaking every deep import in
      # src/auth/pkceAuthProvider.js. Delete once upstream republishes.
      - dependency-name: "@openid/appauth"
        versions: ["1.4.0"]
    groups:
      # date-fns-tz 3.2.0 peers date-fns `^3.0.0 || ^4.0.0`, so a major of
      # either one alone re-selects an unsatisfiable peer -- that is how #192
      # failed. @date-io/date-fns, the third package in #249's triangle, was
      # removed in 5fe26179, so it needs no pattern here. No update-types, so
      # majors group too; listed before frontend-minor-and-patch because a
      # dependency joins the first group it matches, and that one would
      # otherwise capture their minor updates and split the pair again.
      date-fns:
        patterns:
          - "date-fns"
          - "date-fns-tz"
      # sass-embedded's fallback platform packages depend on sass at an exact
      # version, so bumping sass alone nests a second copy of it under each --
      # that is what #324 did. sass-embedded also skips releases sass publishes
      # (there is no sass-embedded 1.103.0), which is how the pair split despite
      # both being minor updates. Listed before frontend-minor-and-patch because
      # a dependency joins the first group it matches, and that one would
      # otherwise capture them and split the pair again.
      sass:
        patterns:
          - "sass"
          - "sass-embedded"
      frontend-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
      include: "scope"
    labels: ["maintenance", "documentation"]
    groups:
      # react and react-dom pin each other exactly -- react-dom peers react at
      # its own version -- so a PR bumping either one alone cannot resolve, and
      # both #186 and #187 failed `npm ci` for that reason. No update-types
      # here, so majors group too; listed before docs-minor-and-patch because a
      # dependency joins the first group it matches, and that one would
      # otherwise capture their minor updates and split the pair again.
      react:
        patterns:
          - "react"
          - "react-dom"
      docs-minor-and-patch:
        update-types: ["minor", "patch"]
