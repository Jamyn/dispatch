name: Docs build

# PR gate that actually builds the Docusaurus site. lockfile-sync only proves
# the docs lockfile is self-consistent; a dependency bump can pass it and
# still break the build (Dependabot #22 does exactly that). Path-filtered,
# which is safe only while this is not a required check.

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --no-audit --no-fund
      # onBrokenLinks/onBrokenAnchors are set to "throw", so this is also the
      # gate on every internal link and anchor across the site.
      - run: npm run build
