name: Frontend CI

# Lint and unit tests for the Vue frontend. Replaces the disabled
# javascript.yml (node 16, `npm install`).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dispatch/static/dispatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/dispatch/static/dispatch/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npx vitest run --dom
      # The production vite build. Neither lint nor vitest resolves the
      # `exports` maps that a bundler enforces, so a dependency bump can pass
      # both and still fail here -- monaco-editor 0.56 did exactly that, and
      # until now the first thing to notice would have been the image build in
      # dispatch-docker, which only runs after a release is tagged.
      # Takes ~45s; deliberately not gated behind a paths: filter.
      # Note `npm run build` also rewrites components.d.ts: unplugin-vue-
      # components regenerates it from a production scan, which differs from
      # the committed copy (generated from a dev-server run). That drift is
      # pre-existing and not asserted here -- doing so would fail on main.
      - run: npm run build
