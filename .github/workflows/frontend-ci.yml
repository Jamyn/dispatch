name: Frontend CI

# Lint and unit tests for the Vue frontend. Replaces the disabled
# javascript.yml (node 16, `npm install`).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dispatch/static/dispatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/dispatch/static/dispatch/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      # Covers the .ts sources. The 24 SFCs using `<script lang="ts">` are not
      # checked: vue-tsc runs fine on the pinned compiler, but they carry 97
      # pre-existing errors, so gating them needs its own remediation pass.
      # The Playwright specs under tests/static/e2e are likewise uncovered.
      - run: npm run typecheck
      - run: npx vitest run --dom --coverage
      # The production vite build. Neither lint nor vitest resolves the
      # `exports` maps that a bundler enforces, so a dependency bump can pass
      # both and still fail here -- monaco-editor 0.56 did exactly that, and
      # until now the first thing to notice would have been the image build in
      # dispatch-docker, which only runs after a release is tagged.
      # Takes ~45s; deliberately not gated behind a paths: filter.
      # Note `npm run build` also rewrites components.d.ts: unplugin-vue-
      # components regenerates it from a production scan, which differs from
      # the committed copy (generated from a dev-server run). That drift is
      # pre-existing and not asserted here -- doing so would fail on main.
      - run: npm run build

      # vite-plugin-monaco-editor declares no vite peer range and emits the
      # worker from writeBundle, so a vite major can stop firing that hook and
      # still exit 0 -- leaving the JSON editor to load no worker at runtime.
      - name: Assert the monaco worker was emitted
        run: test -s dist/monacoeditorwork/json.worker.bundle.js

      # lcov records SF: paths relative to this package (SF:src/App.vue) and the
      # repository root has its own src/, so Codecov files them at paths that do
      # not exist and no diff maps to them. The action's working-directory does
      # not rewrite them -- verified against a real upload -- and a codecov.yml
      # `fixes` rule cannot help either, because src/ is the prefix the backend
      # report uses too. Rewriting the report is the only unambiguous option.
      - name: Point the coverage report at repository paths
        run: sed -i 's|^SF:src/|SF:src/dispatch/static/dispatch/src/|' coverage/lcov.info

      # Fork PRs cannot read the secret, so failing on a rejected upload is
      # gated on having had a token to upload with.
      - name: Upload frontend coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./src/dispatch/static/dispatch/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
