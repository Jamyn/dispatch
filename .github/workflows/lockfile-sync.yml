name: Lockfile sync

# Fails when a lockfile drifts out of sync with the manifest it was built from,
# for both the npm lockfiles and the Python requirements-lock.txt.
#
# This is the exact failure that broke the image build in #61: the frontend's
# package.json ranges moved while its lockfile kept the old resolutions, so
# `npm ci` refused to install and docker/Dockerfile could not build the UI.
# `npm install` papers over that state, which is why nothing caught it -- only
# `npm ci` validates the two files against each other.
#
# The command below is deliberately the same one docker/Dockerfile runs, so
# this gate cannot drift away from what actually breaks the image.

on:
  pull_request:
  push:
    branches: [main]

# No `paths:` filter on purpose. This is a required status check, and a
# path-filtered required check never reports on PRs that miss the filter,
# which leaves them permanently blocked waiting for a run that never starts.
# The check takes seconds, so it just runs every time.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single job, not a matrix: required status checks are matched by name, and a
  # matrix produces one differently-named check per leg. One job means one
  # stable name to require.
  npm-lock-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check every lockfile against its package.json
        run: |
          set -u
          failed=0
          for dir in . docs src/dispatch/static/dispatch; do
            echo "::group::$dir"
            # --dry-run so nothing is written; the sync check runs before any
            # fetching, so a drifted lockfile fails fast and offline.
            # --ignore-scripts because the frontend has a preinstall hook.
            if (cd "$dir" && npm ci --dry-run --ignore-scripts --no-audit --no-fund); then
              echo "$dir: in sync"
            else
              echo "::error file=$dir/package-lock.json::$dir/package-lock.json is out of sync with $dir/package.json. Regenerate it with 'npm install --package-lock-only' in $dir and commit the result."
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      # `npm ci` above compares the manifest to the lockfile, never the dev
      # flags, so a targeted edit that drops them passes every check here --
      # that is how cross-env #309 went green on this job while leaking 38
      # build-tooling packages into `npm ci --omit=dev`. The frontend is the
      # only lockfile worth gating: docs/ resolves 1419 of 1420 packages into
      # production and the root has 8, so neither has meaningful dev flags to
      # lose. Runs here rather than only in vitest because it needs no
      # node_modules, so it fails in seconds under a name that says lockfile.
      - name: Check the frontend lockfile's dev flags
        run: node src/dispatch/static/dispatch/scripts/check-lock-dev-flags.mjs

  # Separate job so the npm and Python gates report as separately named checks.
  python-lock-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check requirements-lock.txt against pyproject.toml
        run: |
          set -eu
          cp requirements-lock.txt "$RUNNER_TEMP/committed.txt"
          # Read out of docker/Dockerfile rather than repeated here. Dependabot
          # bumps the FROM lines and nothing else, so a second copy of the tag
          # goes stale silently and regenerates the lock on a different base
          # than the image installs it into. sort -u also holds the invariant
          # that both build stages use the same base.
          base=$(sed -n 's/^FROM \(python:[^ ]*\).*/\1/p' docker/Dockerfile | sort -u)
          if [ -z "$base" ] || [ "$(echo "$base" | wc -l)" -ne 1 ]; then
            echo "::error file=docker/Dockerfile::expected one python base image across all FROM lines, got: ${base:-none}"
            exit 1
          fi
          echo "regenerating the lock inside $base"
          # Compiled inside the runtime base image, not on the runner. dkimpy
          # ships sdist-only and picks Py3DNS or dnspython by probing whether a
          # DNS module imports while its metadata is built, so the resolved set
          # differs between a runner and the image unless both resolve here.
          # uv is pinned for the same reason, and reads the existing -o file as
          # pins, so a new release on PyPI does not make this drift.
          docker run --rm -v "$PWD:/w" -w /w "$base" bash -c \
            "pip install -q uv==0.5.9 && uv pip compile pyproject.toml --python-version 3.14 --generate-hashes --constraint constraints.txt -o requirements-lock.txt > /dev/null"
          if ! diff -u "$RUNNER_TEMP/committed.txt" requirements-lock.txt; then
            echo "::error file=requirements-lock.txt::requirements-lock.txt does not satisfy pyproject.toml. Regenerate it with the command in its header comment, run inside $base, and commit the result."
            exit 1
          fi
          echo "requirements-lock.txt: in sync"
