name: Python CI

# Lint, format, and test gates for the backend. The disabled Netflix-era
# python.yml this replaces installed uv via unpinned `curl | sh` and had a
# per-file coverage gate that could never fail (it compared against a
# variable that was never assigned).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.5.9" # same pin as python-lock-sync

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ruff
        # Version comes from .pre-commit-config.yaml so the CI gate can never
        # drift from what the hooks enforce locally.
        run: |
          RUFF_VERSION=$(sed -n 's/^ *rev: v\(.*\)/\1/p' .pre-commit-config.yaml | head -1)
          pipx install "ruff==${RUFF_VERSION}"
      - run: ruff check .
      - run: ruff format --check .

  python-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major as the deployment's pinned postgres image.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: not-a-real-password-tests-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies from the lock
        # The hashed lock is the production closure; test-only tools are
        # layered on top without letting them move locked versions.
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv pip install --system --no-deps --require-hashes -r requirements-lock.txt
          uv pip install --system --no-deps -e .
          uv pip install --system pytest==9.1.1 pytest-mock factory-boy faker easydict devtools schemathesis coverage
      - name: Run pytest with coverage
        run: |
          coverage run -m pytest -q
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
